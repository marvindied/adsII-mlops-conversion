name: MLOps CI Pipeline

# Wann soll die Pipeline starten?
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Den Code aus deinem Repository auf den GitHub-Server laden
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Python auf dem GitHub-Server installieren
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Alle benötigten Bibliotheken installieren
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    # 4. Den Test ausführen, den wir gerade geschrieben haben
    - name: Run Pytest
      run: |
        pytest test_main.py